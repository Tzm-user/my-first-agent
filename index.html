<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>My Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]\:focus {
      border-color: #667eea;
    }
    select {
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      cursor: pointer;
      background: white;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    li:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 15px;
      cursor: pointer;
    }
    li span {
      flex: 1;
      color: #333;
      font-size: 16px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }
    .delete-btn {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 14px;
    }
    .delete-btn:hover {
      box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      font-style: italic;
    }
    .category-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-left: 10px;
      white-space: nowrap;
      color: white;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
    .loading {
      text-align: center;
      color: #999;
      padding: 40px;
    }
  </style>
</head>

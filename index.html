<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]\:focus {
      border-color: #667eea;
    }
    select {
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      cursor: pointer;
      background: white;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    li:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 15px;
      cursor: pointer;
    }
    li span {
      flex: 1;
      color: #333;
      font-size: 16px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }
    .delete-btn {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 14px;
    }
    .delete-btn:hover {
      box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      font-style: italic;
    }
    .category-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-left: 10px;
      white-space: nowrap;
      color: white;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
    .loading {
      text-align: center;
      color: #999;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo List</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="输入待办事项..." onkeypress="handleKeyPress(event)">
      <select id="categorySelect">
        <option value="" disabled>加载中...</option>
      </select>
      <button onclick="addTodo()">添加</button>
    </div>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" onclick="setFilter('全部')">全部</button>
    </div>
    <ul id="todoList"><div class="loading">加载中...</div></ul>
    <div class="status" id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mvdyzahrkjpkbxgzh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZHp5YWhyemtpcGtieXhnemhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxOTQ5OTIsImV4cCI6MjA5Mjc3MDk5Mn0.Ab5u8X7xny-vb4YuKeZMCdBmE4PFG-JTdkPZiwKVuao';

    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    let categories = [];
    let todos = [];
    let currentFilter = '全部';

    async function loadCategories() {                   const res = await fetch(`${SUPABASE_URL}/rest/v1/categories?select=*&order=id`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
      categories = await res.json();
      renderCategorySelect();
      renderCategoryFilters();
    }

    async function loadTodos() {
      const list = document.getElementById('todoList');
      list.innerHTML = '<div class="loading">加载中...</div>';

      let url = `${SUPABASE_URL}/rest/v1/todos?select=*,categories(*)`;
      if (currentFilter !== '全部') {
        const cat = categories.find(c => c.name === currentFilter);
        if (cat) {
          url += `&category_id=eq.${cat.id}`;
        }
      }
      url += '&order=created_at.desc';

      const res = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
      todos = await res.json();
      renderTodos();
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      const categoryId = document.getElementById('categorySelect').value;
      if (!categoryId) {
        alert('请选择分类');
        return;
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/todos`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          title: text,
          completed: false,
          category_id: parseInt(categoryId)
        })
      });

      if (res.ok) {
        input.value = '';
        loadTodos();
      } else {
        alert('添加失败');
      }
    }

    async function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      const res = await fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ completed: !todo.completed })
      });

      if (res.ok) loadTodos();
    }

    async function deleteTodo(id) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/todos?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) loadTodos();
    }

    function renderTodos() {
      const list = document.getElementById('todoList');
      const status = document.getElementById('status');

      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">' + (currentFilter === '全部' ? '暂无待办事项，添加一个吧！' : `暂无「${currentFilter}」类任务`) + '</div>';
        status.textContent = '';
        return;
      }

      list.innerHTML = todos.map(todo => {
        const catColor = todo.categories?.color || '#666';
        const catName = todo.categories?.name || '未知';
        return `
        <li class="${todo.completed ? 'completed' : ''}">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
          <span>${escapeHtml(todo.title)}</span>
          <span class="category-tag" style="background:${catColor}">${catName}</span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">删除</button>
        </li>
      `;
      }).join('');

      const completed = todos.filter(t => t.completed).length;
      const filterLabel = currentFilter === '全部' ? '' : `「${currentFilter}」`;
      status.textContent = `${filterLabel}共 ${todos.length} 项，已完成 ${completed} 项`;
    }

    function renderCategorySelect() {
      const select = document.getElementById('categorySelect');
      select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function renderCategoryFilters() {
      const group = document.getElementById('filterGroup');
      const catButtons = categories.map(c => 
        `<button class="filter-btn" onclick="setFilter('${c.name}')">${c.name}</button>`
      ).join('');
      group.innerHTML = `<button class="filter-btn active" onclick="setFilter('全部')">全部</button>` + catButtons;
    }

    function setFilter(category) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const btnText = btn.textContent.trim();
        const isActive = btnText === category || (category === '全部' && btnText === '全部');
        btn.classList.toggle('active', isActive);
      });
      loadTodos();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') addTodo();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function init() {
      await loadCategories();
      await loadTodos();
    }
    init();
  </script>
</body>
</html>

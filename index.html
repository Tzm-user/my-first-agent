<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>
  <style>
    { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]\:focus {
      border-color: #667eea;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    li:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 15px;
      cursor: pointer;
    }
    li span {
      flex: 1;
      color: #333;
      font-size: 16px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }
    .delete-btn {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 14px;
    }
    .delete-btn:hover {
      box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      font-style: italic;
    }
    .category-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-left: 10px;
      white-space: nowrap;
    }
    .category-工作 { background: #dbeafe; color: #1e40af; }
    .category-学习 { background: #d1fae5; color: #065f46; }
    .category-生活 { background: #ffedd5; color: #9a3412; }
    .status {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo List</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="输入待办事项..." onkeypress="handleKeyPress(event)">
      <select id="categorySelect" style="padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; cursor: pointer;">
        <option value="工作">💼 工作</option>
        <option value="学习">📚 学习</option>
        <option value="生活" selected>🏠 生活</option>
      </select>
      <button onclick="addTodo()">添加</button>
    </div>
    <ul id="todoList"></ul>
    <div class="status" id="status"></div>
  </div>

  <script>
    const CATEGORIES = ['工作', '学习', '生活'];
    const DEFAULT_CATEGORY = '生活';

    function loadTodos() {
      const raw = localStorage.getItem('todos');
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.map(todo => ({
          text: todo.text || '',
          completed: !!todo.completed,
          category: CATEGORIES.includes(todo.category) ? todo.category : DEFAULT_CATEGORY
        }));
      } catch (e) {
        return [];
      }
    }

    let todos = loadTodos();

    function renderTodos() {
      const list = document.getElementById('todoList');
      const status = document.getElementById('status');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">暂无待办事项，添加一个吧！</div>';
        status.textContent = '';
        return;
      }
      
      list.innerHTML = todos.map((todo, index) => `
        <li class="${todo.completed ? 'completed' : ''}">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
          <span>${escapeHtml(todo.text)}</span>
          <span class="category-tag category-${todo.category}">${todo.category}</span>
          <button class="delete-btn" onclick="deleteTodo(${index})">删除</button>
        </li>
      `).join('');

      todos.push({ text, completed: false, category });

    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
    }

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') addTodo();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    renderTodos();
  </script>
</body>

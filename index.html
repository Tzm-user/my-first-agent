<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2em;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]\:focus {
      border-color: #667eea;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    li:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 15px;
      cursor: pointer;
    }
    li span {
      flex: 1;
      color: #333;
      font-size: 16px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }
    .delete-btn {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 14px;
    }
    .delete-btn:hover {
      box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      font-style: italic;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo List</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="输入待办事项..." onkeypress="handleKeyPress(event)">
      <button onclick="addTodo()">添加</button>
    </div>
    <ul id="todoList"></ul>
    <div class="status" id="status"></div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function renderTodos() {
      const list = document.getElementById('todoList');
      const status = document.getElementById('status');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">暂无待办事项，添加一个吧！</div>';
        status.textContent = '';
        return;
      }
      
      list.innerHTML = todos.map((todo, index) => `
        <li class="${todo.completed ? 'completed' : ''}">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
          <span>${escapeHtml(todo.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${index})">删除</button>
        </li>
      `).join('');
      
      const completed = todos.filter(t => t.completed).length;
      status.textContent = `共 ${todos.length} 项，已完成 ${completed} 项`;
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      
      todos.push({ text, completed: false });
      saveTodos();
      input.value = '';
      renderTodos();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
    }

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') addTodo();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    renderTodos();
  </script>
</body>
</html>
